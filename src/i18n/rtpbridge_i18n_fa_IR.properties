sidebar.media-proxy=پراکسی رسانه
sidebar.media-proxy.descr=برای مشاهده تنظیمات پراکسی رسانه کلیک کنید.
mediaproxy.desc = پروکسی رسانه‌ای به مشتریان اجازه می‌دهد تا ارتباطات رسانه‌ای غنی (از جمله VoIP) با یکدیگر برقرار کنند زمانی که ارتباطات نقطه به نقطه شکست می‌خورند، مانند زمانی که یکی یا هر دو مشتری پشت یک دیوار آتشین سختگیرانه هستند.
mediaproxy.settings.success = تنظیمات با موفقیت به‌روزرسانی شد.
mediaproxy.form.label = تنظیمات پروکسی رسانه‌ای
mediaproxy.form.enabled = فعال
mediaproxy.form.enabled.desc = این سرور به عنوان پروکسی رسانه‌ای عمل خواهد کرد.
mediaproxy.form.disabled = غیرفعال
mediaproxy.form.disabled.desc = این سرور به عنوان پروکسی رسانه‌ای عمل نخواهد کرد.
mediaproxy.form.idletimeout = زمان خروج جلسه به دلیل عدم فعالیت (بر حسب ثانیه)
mediaproxy.form.idletimeout.tip = این مقدار معمولاً بیشتر از 15 ثانیه است.
mediaproxy.form.lifetime = مدت زمان زندگی جلسه (بر حسب ثانیه)
mediaproxy.form.lifetime.tip = مدت زمان زندگی حداکثر زمانی است که یک جلسه می‌تواند ادامه یابد. پس از این زمان، حتی اگر هنوز فعال باشد، نابود می‌شود.
mediaproxy.form.minport = حداقل محدوده پورت
mediaproxy.form.maxport = حداکثر محدوده پورت
mediaproxy.form.echoport = پورت آزمایش اکو
mediaproxy.summary.label = خلاصه جلسات فعال
mediaproxy.summary.desc = جلسات، کانال‌های پروکسی رسانه‌ای هستند که کنترل انتقال بسته‌ها را بر عهده دارند. فهرست زیر جلسات فعلی و کاربری که کانال را ایجاد کرده است را نشان می‌دهد.
mediaproxy.summary.session.creator  = سازنده
mediaproxy.summary.session.port = پورت
mediaproxy.summary.session.server = سرور
mediaproxy.summary.session.inactivity = عدم فعالیت (ثانیه)
mediaproxy.summary.session.type = نوع
mediaproxy.summary.session.noactive = هیچ جلسه فعالی وجود ندارد
mediaproxy.summary.stopbutton = توقف جلسات فعال
global.save_settings=ذخیره تنظیمات
