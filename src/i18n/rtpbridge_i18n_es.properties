sidebar.media-proxy=Proxy de Multimedios
sidebar.media-proxy.descr=Haga clic para ver la configuración del puente RTP (proxy de medios).
mediaproxy.desc = El proxy de medios permite a los clientes realizar conexiones multimedia (incluyendo VoIP) a otros clientes cuando conexiones punto a punto no son posibles. Usualmente conexiones punto a punto no son posibles cuando uno o los dos clientes se encuentran detras de cortafuegos.
mediaproxy.settings.success = Configuración actualizada exitosamente.
mediaproxy.form.label = Configuración del Proxy de Medios
mediaproxy.form.enabled = Habilitado
mediaproxy.form.enabled.desc = El servidor va a actuar como un proxy de medios.
mediaproxy.form.disabled = Deshabilitado
mediaproxy.form.disabled.desc = El servidor no va a actuar como un proxy de medios.
mediaproxy.form.idletimeout = Tiempo máximo de Inactividad (en segundos)
mediaproxy.form.idletimeout.tip = Este valor es usualmente mayor a los 15 segundos.
mediaproxy.form.lifetime = Tiempo de Vida de la Sesión (en segundos)
mediaproxy.form.lifetime.tip = Tiempo de Vida es el tiempo máximo que una sesión puede vivir. Después de este tiempo la sesión será destruida aún si se encontraba activa.
mediaproxy.form.minport = Rango mínimo del Puerto
mediaproxy.form.maxport = Rango máximo del Puerto
mediaproxy.form.echoport = Puerto de Test de Eco
mediaproxy.summary.label = Listado de Sesiones Activas
mediaproxy.summary.desc = Las sesiones son canales de proxy de medios que controlan la transmisión de paquetes. La siguiente lista muestra las sesiones actuales y los usuarios que crearon las mismas.
mediaproxy.summary.session.creator  = Creador
mediaproxy.summary.session.port = Puerto
mediaproxy.summary.session.server = Servidor
mediaproxy.summary.session.inactivity = Inactividad (segs)
mediaproxy.summary.session.type = Tipo
mediaproxy.summary.session.noactive = No se han encontrado sesiones activas
mediaproxy.summary.stopbutton = Para Sesiones Activas
