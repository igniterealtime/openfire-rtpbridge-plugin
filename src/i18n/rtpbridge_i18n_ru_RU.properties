sidebar.media-proxy=Медиа-прокси
sidebar.media-proxy.descr=Нажмите, чтобы просмотреть настройки прокси-сервера
mediaproxy.desc = Прокси-сервер мультимедиа позволяет клиентам создавать мультимедийные (в том числе VoIP) соединения друг с другом при сбое соединений одноранговых соединений, например, когда один или оба клиента находятся за строгим брандмауэром.
mediaproxy.settings.success = Настройки успешно обновлены.
mediaproxy.form.label = Настройки прокси-сервера мультимедиа
mediaproxy.form.enabled = Включить
mediaproxy.form.enabled.desc = Этот сервер будет выступать в качестве мультимедийного прокси-сервера.
mediaproxy.form.disabled = Отключить
mediaproxy.form.disabled.desc = Этот сервер не будет выступать в качестве мультимедийного прокси-сервера.
mediaproxy.form.idletimeout = Тайм-аут простоя сеанса (в секундах)
mediaproxy.form.idletimeout.tip = Это значение обычно больше 15 секунд.
mediaproxy.form.lifetime = Время жизни сеанса (в секундах)
mediaproxy.form.lifetime.tip = Время жизни - это максимальное время жизни сеанса. По истечении этого времени он закрывается, даже если остается активным.
mediaproxy.form.minport = Мин. диапазон портов
mediaproxy.form.maxport = Макс. диапазон портов
mediaproxy.form.echoport = Порт проверки эхо (ECHO)
mediaproxy.summary.label = Сводка активных сеансов
mediaproxy.summary.desc = Сеансы представляют собой каналы прокси-сервера мультимедиа, которые управляют ретрансляцией пакетов. В приведенном ниже списке показаны текущие сеансы и какой пользователь создал канал.
mediaproxy.summary.session.creator  = Создатель
mediaproxy.summary.session.port = Порт
mediaproxy.summary.session.server = Сервер
mediaproxy.summary.session.inactivity = Бездействие (сек)
mediaproxy.summary.session.type = Тип
mediaproxy.summary.session.noactive = Нет активных сеансов
mediaproxy.summary.stopbutton = Остановить активные сеансы
global.save_settings=Сохранить настройки
