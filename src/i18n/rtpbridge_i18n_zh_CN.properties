sidebar.media-proxy=媒体代理
sidebar.media-proxy.descr=点击即可查看媒体代理设置。
mediaproxy.desc = 当对等连接失败时，例如当一个或两个客户端都在严格的防火墙后面时，媒体代理使客户端能够进行富媒体（包括 VoIP）连接。
mediaproxy.settings.success = 设置更新成功。
mediaproxy.form.label = 媒体代理设置
mediaproxy.form.enabled = 已启用
mediaproxy.form.enabled.desc = 此服务器将充当媒体代理。
mediaproxy.form.disabled = 已禁用
mediaproxy.form.disabled.desc = 此服务器不会充当媒体代理。
mediaproxy.form.idletimeout = 会话空闲超时（秒）
mediaproxy.form.idletimeout.tip = 此值通常大于 15 秒。
mediaproxy.form.lifetime = 会话寿命（秒）
mediaproxy.form.lifetime.tip = 寿命是会话可以存活的最长时间。在这段时间之后，即使它仍然处于活动状态，它也会被摧毁。
mediaproxy.form.minport = 端口范围最小值
mediaproxy.form.maxport = 端口范围最大值
mediaproxy.form.echoport = 回声测试端口
mediaproxy.summary.label = 活动会话摘要
mediaproxy.summary.desc = 会话是控制数据包中继的媒体代理通道。下面的列表显示当前正在运行的会话以及哪个用户创建了该通道。
mediaproxy.summary.session.creator  = 创建者
mediaproxy.summary.session.port = 端口
mediaproxy.summary.session.server = 服务器
mediaproxy.summary.session.inactivity = 不活动（秒）
mediaproxy.summary.session.type = 类型
mediaproxy.summary.session.noactive = 没有活动会话
mediaproxy.summary.stopbutton = 停止活动会话
global.save_settings=保存设置
