sidebar.media-proxy=Medien-Proxy
sidebar.media-proxy.descr=Hier klicken, um die Medien-Proxy Einstellungen anzuzeigen.
mediaproxy.desc = Der Medien-Proxy ermöglicht es den Clients, rich media (einschließlich VoIP) Verbindungen miteinander aufzubauen when Peer-zu-Peer Verbindungen versagen, so wie wenn sich einer oder beide Clients hinter einer stark gesicherten Firewall befinden.
mediaproxy.settings.success = Einstellungen erfolgreich aktualisiert.
mediaproxy.form.label = Medien-Proxy Einstellungen
mediaproxy.form.enabled = Aktiviert
mediaproxy.form.enabled.desc = Dieser Server wird als Medien-Proxy arbeiten.
mediaproxy.form.disabled = Deaktiviert
mediaproxy.form.disabled.desc = Dieser Server wird nicht als Medien-Proxy arbeiten.
mediaproxy.form.idletimeout = Timeout der inaktiven Sitzung (in Sekunden)
mediaproxy.form.idletimeout.tip = Dieser Wert ist gewöhnlich größer als 15 Sekunden.
mediaproxy.form.lifetime = Sitzungslaufzeit (in Sekunden)
mediaproxy.form.lifetime.tip = Laufzeit ist die maximal mögliche Zeitdauer einer Sitzung. Nach Ablauf dieser wird sie wird sie geschlossen, auch wenn sie noch aktiv ist.
mediaproxy.form.minport = Minimaler Port-Bereich
mediaproxy.form.maxport = Maximaler Port-Bereich
mediaproxy.form.echoport = Echo Test Port
mediaproxy.summary.label = Überblick aktueller Sitzungen
mediaproxy.summary.desc = Die Sitzungen sind Medien-Proxy Kanäle, welche die Paketübertragung kontrollieren. Die untere Liste zeigt aktuell laufende Sitzungen und den Nutzer, der den Kanal erstellt hat.
mediaproxy.summary.session.creator  = Erzeuger
mediaproxy.summary.session.port = Port
mediaproxy.summary.session.server = Server
mediaproxy.summary.session.inactivity = Inaktivität(Sekunden)
mediaproxy.summary.session.type = Typ
mediaproxy.summary.session.noactive = Keinen aktiven Sitzungen
mediaproxy.summary.stopbutton = Aktive Sitzungen anhalten
