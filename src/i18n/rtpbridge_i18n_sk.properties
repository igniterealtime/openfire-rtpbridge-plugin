mediaproxy.form.enabled.desc = Tento server bude slúžiť ako multimediálne proxy.
mediaproxy.form.disabled = Vypnutá
mediaproxy.form.disabled.desc = Tento server nebude slúžiť ako multimediálne proxy.
mediaproxy.form.idletimeout = Čas expirácie relácie (v sekundách)
