sidebar.media-proxy=P=Multimediálny proxy
sidebar.media-proxy.descr=t=Kliknutím zobrazíte nastavenia multimediálneho proxy.
mediaproxy.desc = Multimediálny proxy umožňuje klientom nadväzovať multimediálne spojenia (vrátane VoIP) s inými, keď zlyhajú spojenia peer-to-peer, ako v prípade, že sa jeden alebo obaja klienti nachádzajú za prísnym firewallom.
mediaproxy.settings.success = Nastavenia úspešne aktualizované.
mediaproxy.form.label = Nastavenia multimediálneho proxy
