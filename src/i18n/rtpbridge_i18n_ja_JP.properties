sidebar.media-proxy=メディアプロキシー
sidebar.media-proxy.descr=メディアプロキシー設定を参照する場合にクリックしてください。
mediaproxy.desc = メディアプロキシーは、1人のクライアント、もしくは両方のクライアントが厳重なファイアウォールの後にいる場合のようなpeer to peer接続が失敗してしまうときに、クライアントが相手にリッチメディア(VoIPを含む)接続をすることを可能にします。
mediaproxy.settings.success = 設定が正常に更新されました。
mediaproxy.form.label = メディアプロキシー設定
mediaproxy.form.enabled = 使用可能
mediaproxy.form.enabled.desc = このサーバーはメディアプロキシーとして動作します。
mediaproxy.form.disabled = 無効
mediaproxy.form.disabled.desc = このサーバーはメディアプロキシーとして動作しません。
mediaproxy.form.idletimeout = セッションアイドルタイムアウト (秒)
mediaproxy.form.idletimeout.tip = この値は通常は15秒以上に設定します。
mediaproxy.form.lifetime = セッションライフタイム(秒)
mediaproxy.form.lifetime.tip = ライフタイムはセッションが生存することができる最大値です。この時間が経過すると、たとえまだアクティブ状態でもセッションは切断されます。
mediaproxy.form.minport = 最小ポート範囲
mediaproxy.form.maxport = 最大ポート範囲
mediaproxy.form.echoport = テストポートをエコー
mediaproxy.summary.label = アクティブセッション要約
mediaproxy.summary.desc = セッションは、中継しているパケットを制御するメディアプロキシーチャネルです。下のリストは、現在の作動しているセッションで、ユーザーがチャネルを作成したものを表示しています。
mediaproxy.summary.session.creator  = 作成者
mediaproxy.summary.session.port = ポート
mediaproxy.summary.session.server = サーバー
mediaproxy.summary.session.inactivity = 動作していない時間(秒)
mediaproxy.summary.session.type = タイプ
mediaproxy.summary.session.noactive = アクティブセッションがありません。
mediaproxy.summary.stopbutton = アクティブセッションを停止
global.save_settings=設定の保存
