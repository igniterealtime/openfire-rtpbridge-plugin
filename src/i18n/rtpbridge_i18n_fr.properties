sidebar.media-proxy=Proxy Média
sidebar.media-proxy.descr=Cliquez pour afficher les paramètres du proxy média.
mediaproxy.desc = Le proxy média permet aux clients d&#39;établir des connexions multimédias (y compris VoIP) entre eux lorsque les connexions peer to peer échouent, par exemple lorsqu&#39;un ou les deux clients se trouvent derrière un pare-feu strict.
mediaproxy.settings.success = Les paramètres ont été mis à jour avec succès.
mediaproxy.form.label = Paramètres du proxy média
mediaproxy.form.enabled = Activé
mediaproxy.form.enabled.desc = Ce serveur agira comme un proxy média.
mediaproxy.form.disabled = Désactivé
mediaproxy.form.disabled.desc = Ce serveur n&#39;agira pas comme un proxy média.
mediaproxy.form.idletimeout = Dépassement du délai d&#39;inactivité de la session (en secondes)
mediaproxy.form.idletimeout.tip = Cette valeur est généralement supérieure à 15 secondes.
mediaproxy.form.lifetime = Durée de vie de la session (en secondes)
mediaproxy.form.lifetime.tip = La durée de vie est la durée maximale de vie d&#39;une session. Après cette durée, elle est détruite, même si elle est toujours active.
mediaproxy.form.minport = Plage de ports Min
mediaproxy.form.maxport = Plage de ports Max
mediaproxy.form.echoport = Port de test écho
mediaproxy.summary.label = Résumé des sessions actives
mediaproxy.summary.desc = Les sessions sont des canaux proxy média qui contrôlent le relais des paquets. La liste ci-dessous indique les sessions en cours d&#39;exécution et l&#39;utilisateur qui a créé le canal.
mediaproxy.summary.session.creator  = Créateur
mediaproxy.summary.session.port = Port
mediaproxy.summary.session.server = Serveur
mediaproxy.summary.session.inactivity = Inactivité (sec)
mediaproxy.summary.session.type = Type
mediaproxy.summary.session.noactive = Aucune session active
mediaproxy.summary.stopbutton = Arrêter les sessions actives
