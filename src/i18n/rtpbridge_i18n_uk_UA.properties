mediaproxy.form.echoport = Тестовий порт відлуння
mediaproxy.summary.label = Підсумок активних сесій
mediaproxy.summary.desc = Сесії – це медіапроксі-канали, які керують ретрансляцією пакетів. У списку нижче показано поточні запущені сеанси та користувач, який створив канал.
