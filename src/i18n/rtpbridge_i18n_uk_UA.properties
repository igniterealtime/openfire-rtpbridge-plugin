sidebar.media-proxy=Медіа-проксі
sidebar.media-proxy.descr=Натисніть, щоб переглянути налаштування медіапроксі.
mediaproxy.desc = Проксі-сервер медіа дозволяє клієнтам встановлювати мультимедійні (включаючи VoIP) з’єднання один з одним у разі збою однорангових з’єднань, наприклад, коли один або обидва клієнти знаходяться за суворим брандмауером.
mediaproxy.settings.success = Налаштування успішно оновлено.
mediaproxy.form.label = Параметри медіапроксі
mediaproxy.form.enabled = Увімкнено
mediaproxy.form.enabled.desc = Цей сервер діятиме як медіа-проксі.
mediaproxy.form.disabled = Вимкнено
mediaproxy.form.disabled.desc = Цей сервер не працюватиме як медіа-проксі.
mediaproxy.form.idletimeout = Час простою сеансу (у секундах)
mediaproxy.form.idletimeout.tip = Зазвичай це значення перевищує 15 секунд.
mediaproxy.form.lifetime = Тривалість сеансу (у секундах)
mediaproxy.form.lifetime.tip = Час життя – це максимальний час, протягом якого може жити сесія. Після закінчення цього часу він знищується, навіть якщо він все ще активний.
mediaproxy.form.minport = Мінімальний діапазон портів
